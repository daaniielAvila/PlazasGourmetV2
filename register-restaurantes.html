<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro e Inicio de Sesión</title>
          <link rel="stylesheet" href="style-register.css">

</head>
<body>
    <div class="form-container">
        <div id="register-form">
            <h1>Registro de Restaurante</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <div class="form-group">
                    <label for="name">Nombre del Restaurante</label>
                    <input type="text" id="name" name="name" placeholder="Nombre del restaurante" required>
                </div>
                <div class="form-group">
                    <label for="location">Ubicación</label>
                    <input type="text" id="location" name="location" placeholder="Ciudad o dirección" required>
                </div>
                <div class="form-group">
                    <label for="food-type">Tipo de Comida</label>
                    <select id="food-type" name="food-type" required>
                        <option value="">Selecciona una opción</option>
                        <option value="Mediterránea">Mediterránea</option>
                        <option value="Italiana">Italiana</option>
                        <option value="japonesa">Asiatica</option>
                        <option value="americana">Mexicana</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="total-tables">Mesas Totales</label>
                    <input type="number" id="total-tables" name="total-tables" placeholder="Número total de mesas" min="1" required>
                </div>
                <div class="form-group">
                    <label for="available-tables">Mesas Disponibles</label>
                    <input type="number" id="available-tables" name="available-tables" placeholder="Número de mesas disponibles" min="0" required>
                </div>
                <button type="submit" class="submit-btn">Registrar</button>
            </form>
            <button class="toggle-btn" onclick="toggleForms()">¿Ya tienes cuenta? Inicia sesión</button>
        </div>

        <div id="login-form" class="hidden">
            <h1>Iniciar Sesión</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" name="login-email" placeholder="ejemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" name="login-password" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="submit-btn">Iniciar Sesión</button>
            </form>
            <button class="toggle-btn" onclick="toggleForms()">¿No tienes cuenta? Regístrate</button>
        </div>
    </div>

    <script>
        function toggleForms() {
            const registerForm = document.getElementById('register-form');
            const loginForm = document.getElementById('login-form');
            registerForm.classList.toggle('hidden');
            loginForm.classList.toggle('hidden');
        }

        async function registerRestaurant(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const location = document.getElementById('location').value;
            const foodType = document.getElementById('food-type').value;
            const totalTables = document.getElementById('total-tables').value;
            const availableTables = document.getElementById('available-tables').value;

            try {
                const response = await fetch('http://localhost:3000/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        name,
                        location,
                        foodType,
                        totalTables,
                        availableTables
                    })
                });

                if (!response.ok) {
                    throw new Error('Error al registrar el restaurante');
                }

                const data = await response.json();
                if (data.id) {
                    localStorage.setItem('restaurantId', data.id);
                    window.location.href = '/plazasgourmetv2/dashboard.restaurantes.html';
                } else {
                    throw new Error('No se recibió el ID del restaurante');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al registrar el restaurante: ' + error.message);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value; // Changed from 'loginEmail'
            const password = document.getElementById('login-password').value; // Changed from 'loginPassword'

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    throw new Error('Error en el inicio de sesión');
                }

                const data = await response.json();
                if (data.id) {
                    localStorage.setItem('restaurantId', data.id);
                    window.location.href = '/plazasgourmetv2/dashboard.restaurantes.html';
                } else {
                    throw new Error('No se recibió el ID del restaurante');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error en el inicio de sesión: ' + error.message);
            }
        }

        document.getElementById('registerForm').addEventListener('submit', registerRestaurant);

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
